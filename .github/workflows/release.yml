name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with version.go
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          if [ "$TAG" != "v$version" ]; then
            echo "The tag $TAG does not match version.go's v$version."
            exit 1
          fi

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

  github-release:
    name: GitHub release
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
          fi

  publish:
    name: Announce to the Go module proxy
    needs: github-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request the version from proxy.golang.org
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://proxy.golang.org/github.com/entitlerhq/entitler-go/@v/$TAG.info"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
